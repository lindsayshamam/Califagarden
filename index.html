
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Garden Sun Map</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; background: #1a1a1a; }
        #ui { position: absolute; bottom: 20px; left: 5%; width: 90%; background: rgba(255,255,255,0.95); 
              padding: 15px; border-radius: 20px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input[type=range] { width: 100%; height: 25px; margin: 8px 0; accent-color: #2e7d32; }
        label { font-size: 12px; font-weight: bold; color: #333; text-transform: uppercase; }
        .data { font-size: 14px; color: #2e7d32; font-weight: bold; margin-bottom: 5px; }
        .legend { font-size: 10px; color: #666; margin-top: 5px; text-align: center; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="data" id="sun-info">Awaiting GPS...</div>
        
        <label>Time of Day</label>
        <input type="range" id="timeSlider" min="0" max="1439" value="720">
        
        <label>Season (Winter to Summer)</label>
        <input type="range" id="daySlider" min="0" max="364" value="172">
        
        <div class="legend">Blue = North (House) | Red Dot = Test Plant Spot</div>
    </div>

    <script>
        // 1. ENGINE SETUP
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. YARD LAYOUT (1 Unit = 1 Foot)
        // Main Yard: 52' Wide (X) x 36' Deep (Z)
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(52, 36),
            new THREE.MeshStandardMaterial({ color: 0x567d46 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // NORTH: The House (North side of yard)
        const house = new THREE.Mesh(
            new THREE.BoxGeometry(52, 12, 10), 
            new THREE.MeshStandardMaterial({ color: 0x4a90e2 }) // Blue tint for North orientation
        );
        house.position.set(0, 6, -23); // Centered X, 6ft up, pushed 23ft North
        house.castShadow = true;
        scene.add(house);

        // SOUTH: 8ft Solid Vinyl Wall
        const southWall = new THREE.Mesh(
            new THREE.BoxGeometry(52, 8, 0.5),
            new THREE.MeshStandardMaterial({ color: 0xffffff })
        );
        southWall.position.set(0, 4, 18); // 18ft South from center
        southWall.castShadow = true;
        scene.add(southWall);

        // EAST & WEST: 6ft Solid Vinyl Walls
        const sideWallGeo = new THREE.BoxGeometry(0.5, 6, 36);
        const sideWallMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee });
        
        const eastWall = new THREE.Mesh(sideWallGeo, sideWallMat);
        eastWall.position.set(26, 3, 0); // 26ft East
        eastWall.castShadow = true;
        scene.add(eastWall);

        const westWall = new THREE.Mesh(sideWallGeo, sideWallMat);
        westWall.position.set(-26, 3, 0); // 26ft West
        westWall.castShadow = true;
        scene.add(westWall);

        // TEST PLANT (Red Dot) - Currently 10ft from the South Wall
        const plant = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 16, 16),
            new THREE.MeshStandardMaterial({ color: 0xff0000 })
        );
        plant.position.set(0, 0.5, 8); 
        plant.receiveShadow = true;
        scene.add(plant);

        // 3. LIGHTING
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.castShadow = true;
        sunLight.shadow.camera.left = -30;
        sunLight.shadow.camera.right = 30;
        sunLight.shadow.camera.top = 30;
        sunLight.shadow.camera.bottom = -30;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x404040, 0.6));

        camera.position.set(0, 40, 30); // Overhead view
        camera.lookAt(0, 0, 0);

        // 4. LOGIC
        let lat = 34.05, lng = -118.24;
        navigator.geolocation.getCurrentPosition(p => {
            lat = p.coords.latitude; lng = p.coords.longitude;
            updateSun();
        });

        function updateSun() {
            const dayOfYear = parseInt(document.getElementById('daySlider').value);
            const minutes = parseInt(document.getElementById('timeSlider').value);
            const date = new Date(new Date().getFullYear(), 0, 1);
            date.setDate(date.getDate() + dayOfYear);
            date.setHours(Math.floor(minutes / 60), minutes % 60);

            const sunPos = SunCalc.getPosition(date, lat, lng);
            const dist = 100;

            sunLight.position.x = dist * Math.sin(sunPos.azimuth) * Math.cos(sunPos.altitude);
            sunLight.position.y = dist * Math.sin(sunPos.altitude);
            sunLight.position.z = dist * Math.cos(sunPos.azimuth) * Math.cos(sunPos.altitude);

            document.getElementById('sun-info').innerText = 
                `${date.toLocaleDateString('en-US', {month:'short', day:'numeric'})} @ ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
            
            scene.background.setHex(sunPos.altitude > 0 ? 0x87ceeb : 0x0a0a12);
        }

        document.getElementById('timeSlider').addEventListener('input', updateSun);
        document.getElementById('daySlider').addEventListener('input', updateSun);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
        animate();
        updateSun();
    </script>
</body>
</html>
